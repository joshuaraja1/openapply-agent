<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenApply staging sign-in</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">OpenApply staging</p>
    <h1>Candidate sign-in</h1>
    <p id="status" role="status" aria-live="polite">Checking setup…</p>
    <div class="actions">
      <button id="sign-in" hidden>Sign in or create account</button>
      <button id="sign-out" hidden>Sign out</button>
    </div>
    <div class="actions" id="checkout-actions" hidden>
      <button data-plan="monthly">Test $39 monthly checkout</button>
      <button data-plan="semester">Test $129 semester checkout</button>
    </div>
    <p class="note">Private test environment. Checkout uses Stripe test mode; no real card is charged.</p>
  </main>
</body>
</html>
