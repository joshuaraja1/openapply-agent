AWSTemplateFormatVersion: '2010-09-09'
Description: Staging-only candidate artifact credential broker; no browser task or public endpoint.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedPattern: '^[a-z0-9-]{2,24}$'
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  RunLedgerTableName:
    Type: String
  EntitlementTableName:
    Type: String
  ArtifactBucketName:
    Type: String
  ArtifactKmsKeyArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$'
  SigningSecretArn:
    Type: String
    Description: ARN only; SecretString is a base64-encoded random 32-byte key.

Resources:
  BrokerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'openapply-${Environment}-artifact-broker-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BrokerCheckedRunState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RunLedgerTableName}'
              - Effect: Allow
                Action: [dynamodb:ConditionCheckItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RunLedgerTableName}'
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EntitlementTableName}'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SigningSecretArn
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/openapply-${Environment}-artifact-data-role'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/candidates/*/runs/*/receipts/*'

  DataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'openapply-${Environment}-artifact-data-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt BrokerRole.Arn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CandidateArtifactCeiling
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/candidates/*/artifacts/*'
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref ArtifactKmsKeyArn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:application: openapply
                    kms:EncryptionContext:version: '1'
                  'Null':
                    kms:EncryptionContext:candidateId: 'false'
                    kms:EncryptionContext:artifactId: 'false'

  BrokerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'openapply-${Environment}-artifact-broker'
      Runtime: nodejs22.x
      Handler: aws-artifact-credential-lambda.handler
      Role: !GetAtt BrokerRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          ARTIFACT_SIGNING_SECRET_ARN: !Ref SigningSecretArn
          DATA_ROLE_ARN: !GetAtt DataRole.Arn
          ARTIFACT_BUCKET: !Ref ArtifactBucketName
          ARTIFACT_KMS_KEY_ARN: !Ref ArtifactKmsKeyArn
          RUN_LEDGER_TABLE_NAME: !Ref RunLedgerTableName
          ENTITLEMENT_TABLE_NAME: !Ref EntitlementTableName

  TaskBrokerInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Invoke only the candidate artifact broker; no direct S3/KMS permissions.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt BrokerFunction.Arn

Outputs:
  BrokerFunctionArn:
    Value: !GetAtt BrokerFunction.Arn
  TaskBrokerInvokePolicyArn:
    Value: !Ref TaskBrokerInvokePolicy
  ArtifactDataRoleArn:
    Value: !GetAtt DataRole.Arn
