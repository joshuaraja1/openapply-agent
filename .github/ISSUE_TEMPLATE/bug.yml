name: Bug report
description: Report a reproducible problem without including personal application data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove names, emails, addresses, résumés, credentials, and employer-specific private answers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide sanitized input and exact commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
