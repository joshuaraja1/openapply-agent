name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  owned-browser-smoke:
    name: Owned Chromium profile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:doctor
      - run: npm test -- --run test/browser-runtime.test.ts test/browser-doctor.test.ts test/browser-actions.test.ts test/form-mapper.test.ts test/owned-discovery.test.ts test/owned-overleaf.test.ts
        env:
          OPENAPPLY_BROWSER_E2E: "1"

  windows-secret-smoke:
    name: Windows Credential Manager smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each file launches OS ACL checks; serial files avoid competing PowerShell processes.
      - run: npm test -- --no-file-parallelism test/windows-credential-store.integration.test.ts test/windows-acl.integration.test.ts test/windows-private-runtime.integration.test.ts test/windows-private-input-output.integration.test.ts test/application-package-file.test.ts test/setup-init.test.ts test/discovery-output.test.ts test/owned-overleaf.test.ts test/overleaf-renderer.test.ts

  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check portable package contents
        if: matrix.node == 22
        run: |
          npm pack --dry-run --json > package-manifest.json
          node scripts/assert-package.mjs package-manifest.json
      - name: Check committed artifacts and private data
        shell: bash
        run: |
          if git ls-files | grep -E '^(data/private|storage|output|dist|coverage)/|\.(pdf|zip)$'; then
            echo 'Generated or private artifacts are tracked' >&2
            exit 1
          fi
      - run: git diff --exit-code
