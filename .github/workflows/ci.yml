name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scheduler-smoke:
    name: User scheduler smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run test/scheduler.test.ts test/scheduler-platforms.test.ts

  owned-browser-smoke:
    name: Owned Chromium profile smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:doctor
      - run: npm test -- --run test/browser-runtime.test.ts test/browser-doctor.test.ts test/browser-actions.test.ts test/form-mapper.test.ts test/provider-portal.e2e.test.ts test/provider-completion-matrix.e2e.test.ts test/owned-discovery.test.ts test/owned-overleaf.test.ts test/overleaf-session.test.ts test/first-run-browser-flow.e2e.test.ts test/pdf-verification.test.ts test/owner-action-proxy.e2e.test.ts
        env:
          OPENAPPLY_BROWSER_E2E: "1"

  windows-secret-smoke:
    name: Windows Credential Manager smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each file launches OS ACL checks; serial files avoid competing PowerShell processes.
      - run: npm test -- --no-file-parallelism test/windows-credential-store.integration.test.ts test/windows-acl.integration.test.ts test/windows-private-runtime.integration.test.ts test/windows-private-input-output.integration.test.ts test/application-package-file.test.ts test/setup-init.test.ts test/setup-ui.test.ts test/runtime-readiness.test.ts test/discovery-output.test.ts test/owned-overleaf.test.ts test/overleaf-renderer.test.ts test/sqlite-migration.test.ts test/sqlite-runtime.test.ts test/data-controls.test.ts test/queue-handoff-integration.test.ts test/queue-cli.stage.test.ts test/pdf-verification.test.ts

  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check portable package contents
        if: matrix.node == 22
        run: |
          npm pack --dry-run --json > package-manifest.json
          node scripts/assert-package.mjs package-manifest.json
      - name: Check committed artifacts and private data
        shell: bash
        run: |
          if git ls-files | grep -E '^(data/private|storage|output|dist|coverage)/|\.(pdf|zip)$'; then
            echo 'Generated or private artifacts are tracked' >&2
            exit 1
          fi
      - run: git diff --exit-code
