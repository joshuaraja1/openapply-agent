name: Portable distribution smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-package:
    name: Portable package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run distribution:smoke
