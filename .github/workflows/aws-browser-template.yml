name: AWS browser template lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cfn-lint==1.46.0
      - run: cfn-lint cloud/aws-control-plane.yaml cloud/aws-browser-smoke.yaml
