name: Cloud browser image smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated browser image
        run: docker build -f cloud/browser/Dockerfile -t openapply-browser-smoke .
      - name: Start Chromium as a non-root user
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,exec,nosuid,size=1g
          --tmpfs /work:rw,nosuid,size=128m,uid=10001,gid=10001
          --tmpfs /home/openapply:rw,nosuid,size=128m,uid=10001,gid=10001
          --shm-size=1g --cap-drop=ALL --security-opt=no-new-privileges
          openapply-browser-smoke
